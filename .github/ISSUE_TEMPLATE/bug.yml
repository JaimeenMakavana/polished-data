name: Bug
description: Agent behavior, docs, validation, or CI is wrong
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security issues use SECURITY.md, not this form.
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Request text, files touched, commands, CI log.
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Docs involved
      placeholder: AGENT.md, VALIDATION.md, …
